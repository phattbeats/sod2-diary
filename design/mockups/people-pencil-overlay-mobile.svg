    <defs>
  <pattern id="paperGrain" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <rect width="60" height="60" fill="#F1E4C8"/>
    <circle cx="11" cy="14" r="0.6" fill="#C9B388" opacity="0.5"/>
    <circle cx="42" cy="22" r="0.5" fill="#C9B388" opacity="0.4"/>
    <circle cx="29" cy="48" r="0.7" fill="#C9B388" opacity="0.45"/>
    <circle cx="55" cy="51" r="0.4" fill="#C9B388" opacity="0.3"/>
  </pattern>
  <pattern id="leatherGrain" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
    <rect width="80" height="80" fill="#3B2A1A"/>
    <path d="M0 13 q40 -3 80 0 M0 41 q40 4 80 0 M0 67 q40 -4 80 0" stroke="#1B120A"
          stroke-width="0.6" fill="none" opacity="0.5"/>
  </pattern>
  <radialGradient id="lamp" cx="18%" cy="12%" r="65%">
    <stop offset="0%" stop-color="#D4A24C" stop-opacity="0.18"/>
    <stop offset="55%" stop-color="#D4A24C" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#D4A24C" stop-opacity="0"/>
  </radialGradient>
  <filter id="hand" x="-2%" y="-50%" width="104%" height="200%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="0.6"/>
  </filter>
  <symbol id="paperclip" viewBox="0 0 40 60">
    <path d="M20 4 q-9 0 -9 9 v36 q0 9 9 9 t9 -9 v-30 q0 -5 -5 -5 t-5 5 v22"
          fill="none" stroke="#D4A24C" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="touchHint" viewBox="0 0 44 44">
    <rect x="0" y="0" width="44" height="44" fill="none" stroke="#D4A24C"
          stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </symbol>
</defs>

